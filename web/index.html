<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#181818" />
    <title>Mario Web Multiplayer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="toolbar">
        <strong>Mario Web Multiplayer</strong>
        <div class="toolbar-actions">
          <span id="status" class="status">未连接</span>
          <button id="fullscreen" class="ghost-button" type="button">全屏</button>
        </div>
      </header>

      <section id="lobby" class="panel lobby">
        <label>
          昵称
          <input id="name" maxlength="20" value="Player" autocomplete="nickname" />
        </label>
        <label>
          房间号
          <input id="room" maxlength="16" value="PUBLIC" autocapitalize="characters" />
        </label>
        <label>
          原版关卡
          <select id="level">
            <option value="1-1">1-1</option>
            <option value="1-2">1-2</option>
            <option value="1-3">1-3</option>
            <option value="1-4">1-4</option>
          </select>
        </label>
        <label>
          服务器
          <input id="server" value="ws://localhost:8080" inputmode="url" />
        </label>
        <button id="join" type="button">进入房间</button>
      </section>

      <section class="game-shell">
        <canvas id="game" width="1280" height="720" aria-label="游戏画面"></canvas>
        <div id="hud" class="hud"></div>
        <div class="touch-controls" aria-label="触控操作">
          <div class="touch-left">
            <button data-control="left" aria-label="向左">◀</button>
            <button data-control="down" aria-label="下蹲">▼</button>
            <button data-control="right" aria-label="向右">▶</button>
          </div>
          <div class="touch-right">
            <button data-control="run" aria-label="冲刺">Z</button>
            <button data-control="fire" aria-label="火球">C</button>
            <button data-control="jump" aria-label="跳跃">X</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const server = document.querySelector('#server');
        if (!server || location.port !== '5173') return;
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        server.value = `${protocol}//${location.hostname || 'localhost'}:8080`;
      });
    </script>
  </body>
</html>
