name: Mario Asset Harvest

on:
  push:
    branches:
      - asset-harvest-20260805
  workflow_dispatch:

permissions:
  contents: read

env:
  MAX_FILE_MB: "80"

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Prepare tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync jq file
          mkdir -p "$RUNNER_TEMP/harvest/raw" "$RUNNER_TEMP/harvest/licenses" "$RUNNER_TEMP/harvest/logs"

      - name: Download repositories and extract assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$RUNNER_TEMP/harvest"
          WORK="$RUNNER_TEMP/repos"
          mkdir -p "$WORK"

          cat > "$ROOT/repositories.txt" <<'REPOS'
          reruns/mario
          tylerreichle/mario_js
          marianamoiolicapelari/super-mario
          MatheusCouti/SuperMario
          fairyyang888/super-mario-html5-game
          jytprks/super-mario
          UMJS/Game-SuperMario
          Chriszhang6/mario
          mattysteves/super-mario-bros
          aayushman108/Super-Mario_Js-Final-Project
          earkyAutoMode/super-mario-clone
          vimaltiwari2612/Super-Mario-Bros
          YvesDeSa/dio-super-mario
          RoaAssaad/super-princess-peach-game
          JoaoGabriellBR/SuperMarioGame
          tomoto0/super_mario
          tomoto0/super_mario_game
          AlineCarolina/Mario-Javascript
          TheDataPioneer/Super_Bowsers_World
          raphaelchiqueti13/SuperMario_Game
          FullMonkeyy/Super-Mario-Web-Game
          LABELLECANDIDO/jogomario.github.io
          GabsAmorim/JavaScriptGame
          CaioNazario/JogoMario
          scottyrogers10/mario-underground
          arminrosu/super-lcdgame.js
          kubowania/mario
          Stabyourself/mari0
          Mari0-CE/Mari0-Community-Edition
          FullScreenShenanigans/FullScreenMario
          REPOS

          printf 'repository,status,asset_files,asset_bytes,commit,default_branch,license\n' > "$ROOT/repository-summary.csv"
          printf 'repository\tpath\treason\n' > "$ROOT/skipped-files.tsv"

          while IFS= read -r repo; do
            repo="${repo//[[:space:]]/}"
            [ -n "$repo" ] || continue
            slug="${repo//\//__}"
            target="$WORK/$slug"
            out="$ROOT/raw/$slug"
            licout="$ROOT/licenses/$slug"
            mkdir -p "$out" "$licout"

            echo "===== $repo =====" | tee -a "$ROOT/logs/harvest.log"

            meta="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$repo" 2>/dev/null || true)"
            default_branch="$(jq -r '.default_branch // "unknown"' <<<"$meta" 2>/dev/null || echo unknown)"
            license="$(jq -r '.license.spdx_id // "NOASSERTION"' <<<"$meta" 2>/dev/null || echo NOASSERTION)"

            rm -rf "$target"
            if ! timeout 300 git clone --depth 1 --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" "$target" >>"$ROOT/logs/harvest.log" 2>&1; then
              printf '%s,%s,0,0,,%s,%s\n' "$repo" clone_failed "$default_branch" "$license" >> "$ROOT/repository-summary.csv"
              rm -rf "$target"
              continue
            fi

            commit="$(git -C "$target" rev-parse HEAD 2>/dev/null || true)"
            count=0
            bytes=0

            while IFS= read -r -d '' src; do
              rel="${src#"$target"/}"
              size="$(stat -c '%s' "$src" 2>/dev/null || echo 0)"
              max_bytes=$((MAX_FILE_MB * 1024 * 1024))
              if [ "$size" -gt "$max_bytes" ]; then
                printf '%s\t%s\tover_%sMB\n' "$repo" "$rel" "$MAX_FILE_MB" >> "$ROOT/skipped-files.tsv"
                continue
              fi
              mkdir -p "$out/$(dirname "$rel")"
              cp -p "$src" "$out/$rel"
              count=$((count + 1))
              bytes=$((bytes + size))
            done < <(
              find "$target" -type f -not -path '*/.git/*' \( \
                -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' -o -iname '*.webp' -o -iname '*.bmp' -o -iname '*.svg' -o -iname '*.ico' -o -iname '*.apng' -o -iname '*.tga' -o -iname '*.ase' -o -iname '*.aseprite' -o -iname '*.psd' \
                -o -iname '*.wav' -o -iname '*.ogg' -o -iname '*.mp3' -o -iname '*.flac' -o -iname '*.m4a' -o -iname '*.aac' -o -iname '*.mid' -o -iname '*.midi' -o -iname '*.mod' -o -iname '*.xm' -o -iname '*.s3m' \
                -o -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' -o -iname '*.fnt' \
                -o -iname '*.tmx' -o -iname '*.tsx' -o -iname '*.tmj' -o -iname '*.tsj' -o -iname '*.ldtk' -o -iname '*.ldtkl' -o -iname '*.map' \
                -o -iname '*.glb' -o -iname '*.gltf' -o -iname '*.obj' -o -iname '*.fbx' -o -iname '*.dae' \
                -o -iname '*.mp4' -o -iname '*.webm' \
                -o -iname '*.zip' -o -iname '*.7z' -o -iname '*.rar' -o -iname '*.tar' -o -iname '*.gz' \
                -o -iname '*atlas*.json' -o -iname '*sprites*.json' -o -iname '*tiles*.json' -o -iname '*level*.json' -o -iname '*map*.json' \
              \) -print0
            )

            while IFS= read -r -d '' doc; do
              rel="${doc#"$target"/}"
              mkdir -p "$licout/$(dirname "$rel")"
              cp -p "$doc" "$licout/$rel"
            done < <(find "$target" -type f -not -path '*/.git/*' \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' -o -iname 'README*' -o -iname 'CREDITS*' -o -iname 'ATTRIBUTION*' \) -print0)

            printf '%s,%s,%s,%s,%s,%s,%s\n' "$repo" ok "$count" "$bytes" "$commit" "$default_branch" "$license" >> "$ROOT/repository-summary.csv"
            rm -rf "$target"
          done < "$ROOT/repositories.txt"

          find "$ROOT/raw" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/all-files-sha256.txt" || true
          du -sh "$ROOT" | tee "$ROOT/logs/size.txt"

      - name: Upload harvested asset pool
        uses: actions/upload-artifact@v4
        with:
          name: mario-asset-harvest-final
          path: ${{ runner.temp }}/harvest
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
