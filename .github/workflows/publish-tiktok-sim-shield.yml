name: Publish verified TikTok SIM Shield APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-tiktok-sim-shield.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore original upload, verify SHA-256, and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, urllib.request, urllib.error
          repo = os.environ['GITHUB_REPOSITORY']
          root = 'https://api.github.com/repos/' + repo
          expected = '48a086c56650dc6fd635db1d2326acfe84b58b1d64aa16492a461c83182352f2'
          expected_blob = '879b8499ffb6c377d9246c03097124a2cedc6ba3'
          path = 'TikTok-SIM-Shield/TikTok-SIM-Shield-Universal-v8.apk'
          def api(endpoint, method='GET', data=None):
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'TikTok-SIM-Shield-Publisher'}
              raw = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(root + endpoint, data=raw, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=40) as response:
                  return json.load(response)
          # The staging object is NOT a release APK. Repair transport transcription,
          # then fail closed unless the result matches the owner's original file.
          staging = api('/git/blobs/456d5f53ec83d5d0c2e8eda40be3768280b772e5')
          text = ''.join(staging['content'].split())
          repairs = [
              ('ccXHx9dfjfi', 'ccXHx9fjfi'),
              ('ewTIvETETJq884', 'ewTIvETJq884'),
              ('EUtqX6XvVh', 'EUtqXvVh'),
              ('Dmpv9UbynF8XzINPjsPfnkefH4evD4IPbYAP/rU8e', 'Dmpv9Ubyn8XzINPjsPfnkefH4evDIP/rU8e'),
              ('H0zhywQ8Qd5', 'H0zhywQd5'),
          ]
          for old, new in repairs:
              count = text.count(old)
              if count > 1:
                  raise RuntimeError('Ambiguous transport repair')
              if count:
                  text = text.replace(old, new, 1)
          runs = list(re.finditer('A{30,}', text))
          if len(runs) != 4:
              raise RuntimeError('Unexpected transport padding structure')
          for match, count in reversed(list(zip(runs, [266, 90, 1510, 1618]))):
              text = text[:match.start()] + 'A' * count + text[match.end():]
          block_hashes = 'c54409f16b90b958 4b1715774ac9b0bc ef227fcd37e3f8f8 aebef66cdc274e8e b862921e8026a763 03ec8b6f78196a4e bac38adff70271ef 793194c4cb083718 fd0224b37685e595 d2c4f03cafa38053 1a91f8d5a6636dd8 da81e661a634c9b5 1fe7b6b9f0072f77 0b7f212da2c654e9 1775458857cf5159 e1f7bc4549cc6aae 4035ce11f9d2fb27 cfd9f4f952042052 ac2585b445224533 8271a3e253faad6c 57358339619c534c 47a2fdce7d382e88 e1f400003a793549 41527a796a1f9f13 091f64ca65704571 6b8cd8d5a1dca166 d2e161a573516c0e d3a5378c62261f0e 208e34eaaf76aea4 6d3630d7b3f26089 e44b3d0f20feb9ad 9820c49c5aba953c bda23ea93b5a37b6 5d70ccfe78aa79da 0727b39420473d67 9ded896acfc47f1b 34643a7862710b00 838ca184b4d9786c ee65cf64acfa123b 5f590602b70abf17 0bb4d076fbc1fad2 b038ac441c55060f 90382ddca6b144d2 ca45a4a2d5d74317 e419ba852e522fc9 9f935f442b37eb08 d99718b3a5350eb3 d5f441466f6df07f b6ffde887d22d205 877442bb68d991f2 4afbf38fce77b859 c31348747f51d678 202c6b9a34e02d63 a8167649485c82ca f2c83287cef327a2 ee0f4b3c9226c5b2 0d3c10405fd9d836 d7e1291cc25e318d caf89716b3dce6b8 6169983394b83c71 7ecb4f2fec5fadf7 0eea753a42fdaaa0 d57f005033578b81 319ff782f46087bd fe215a46d3faee58 6d5912b481d5032f 0c5099594743ed26 b34eb0c18b061a2e 0924f657282ef4f2 efb4b0438da3b1b4 f4a809b2c616712e c2d395087d237b20 32beecb58a128af8 32beecb58a128af8 fba9d3c4513019db 01950ab553c10828 41421998920f7e45 28a805d2e6094549 ef4c609c5dbe62d9 8c263e8140003efe 5bbeea2c5cfe9deb 9d6fc34006977a64 3045fed8b40821c0 32beecb58a128af8 32beecb58a128af8 277cb886f4b1b386 7a8791419d095489 ee7e5b4bc90d8250'.split()
          failures = []
          for index, digest in enumerate(block_hashes):
              block = text[index*512:(index+1)*512]
              if hashlib.sha256(block.encode()).hexdigest()[:16] != digest:
                  failures.append(index)
                  print('MISMATCH_BLOCK', index, block)
          print('Transport base64 length:', len(text))
          if failures or len(text) != 44836:
              raise RuntimeError('Integrity validation failed; no APK was published')
          apk = base64.b64decode(text, validate=True)
          if len(apk) != 33627 or hashlib.sha256(apk).hexdigest() != expected:
              raise RuntimeError('Original APK SHA-256 mismatch; refusing to publish')
          blob = hashlib.sha1(b'blob ' + str(len(apk)).encode() + b'\0' + apk).hexdigest()
          if blob != expected_blob:
              raise RuntimeError('Original Git object hash mismatch')
          print('Verified original APK:', len(apk), 'bytes, SHA-256', expected)
          try:
              existing = api('/contents/' + path + '?ref=main')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              existing = None
          if existing:
              if existing.get('sha') != expected_blob:
                  raise RuntimeError('A different APK already exists; refusing to overwrite')
              print('Exact original APK already published:', existing['html_url'])
          else:
              result = api('/contents/' + path, 'PUT', {'message': 'release: publish verified original TikTok SIM Shield universal-v8 APK', 'branch': 'main', 'content': base64.b64encode(apk).decode()})
              if result['content']['sha'] != expected_blob:
                  raise RuntimeError('Published blob SHA mismatch')
              print('Published APK:', result['content']['html_url'])
          readback = api('/contents/' + path + '?ref=main')
          saved = base64.b64decode(readback['content'])
          if saved != apk or hashlib.sha256(saved).hexdigest() != expected:
              raise RuntimeError('Repository download verification failed')
          print('DOWNLOAD_VERIFIED', readback['download_url'], len(saved), expected)
          PY
